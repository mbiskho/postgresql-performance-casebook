# Casebook server configuration.
#
# Sized for a Docker VM with ~4 GB RAM and SSD storage. The values are close to
# what a small production instance would run with; nothing here is tuned to
# make a particular case look better or worse.

listen_addresses = '*'
max_connections = 120

# Memory
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 16MB
maintenance_work_mem = 512MB

# Planner: SSD-backed storage
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Parallelism
max_worker_processes = 8
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4

# JIT compilation adds tens to hundreds of milliseconds of variable compile
# time to expensive queries. It is switched off so timings compare plans, not
# compiler warm-up. See docs/indexing-decision-guide.md for the trade-off.
jit = off

# WAL / checkpoints: large enough that the 50M-row seed is not dominated by
# forced checkpoints.
wal_level = replica
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# Autovacuum stays on. Case 05 switches it off for a single table to reproduce
# analyze lag deterministically.
autovacuum = on
autovacuum_naptime = 15s

# Instrumentation
shared_preload_libraries = 'pg_stat_statements,auto_explain'
track_io_timing = on
track_functions = pl
compute_query_id = on

pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off

# auto_explain logs the plan of anything slower than 500 ms, with real row
# counts and buffers. Per-node timing is off to keep instrumentation overhead
# low; the runner captures full EXPLAIN ANALYZE output itself.
auto_explain.log_min_duration = '500ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = off
auto_explain.log_nested_statements = on
auto_explain.log_format = 'text'

# Logging
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
deadlock_timeout = 200ms
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = 0
